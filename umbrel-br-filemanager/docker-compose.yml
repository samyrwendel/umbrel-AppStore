version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: umbrel-br-filemanager_server_1
      APP_PORT: 80

  server:
    image: filebrowser/filebrowser:v2.55.0
    user: "0:0"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/database/
      - ${APP_DATA_DIR}/data:/config/
      - /:/data
    environment:
      - FB_PORT=80
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/data
      - FB_NOAUTH=true
